version: "3.9"

services:
  luna-bot:
    build: .
    container_name: luna-discord-bot
    working_dir: /app
    environment:
      # Required: provided by platform or .env
      DISCORD_TOKEN: ${DISCORD_TOKEN?DISCORD_TOKEN is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY?OPENROUTER_API_KEY is required}
    restart: unless-stopped
    command: ["python", "-u", "bot.py"]
